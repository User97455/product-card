<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сайт по уходу за кожей</title>
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/title.css">
  <link rel="stylesheet" href="css/products-list.css">
  <link rel="stylesheet" href="css/product-card.css">
  <link rel="stylesheet" href="css/media.css">
  <link rel="stylesheet" href="css/buy-button.css">
  <link rel="stylesheet" href="css/actions.css">
  <link rel="stylesheet" href="css/more-color-button.css">
</head>

<body>
    <main>
        <h1 class="title" id="mouse-over">Выбери свой продукт</h1>
        <ul class="products-list" id = 'cards-list'>
            <template id = 'cards-template'>
                <li class="product-card"">
                    <img class='product-card__image'/>
                    <span class="product-card__under-name"></span>
                    <h2 class="product-card__product-name"></h2>
                    <p class="product-card__for-what"></p>
                    <span class="product-card__compound">Состав:</span>
                    <ul>
                        <li class="product-card__elements"></li>
                        <li class="product-card__elements"></li>
                        <li class="product-card__elements"></li>
                    </ul>
                    <div class="product-card__price-row">
                        <b class="product-card__price">Цена</b>
                        <span class="product-card__number"></span>
                    </div>
                    <button class="product-card__buy-button buy-button" type= "button">
                        <span class="buy-button__icon">+</span>
                        <span class="buy-button__text">Купить</span>
                    </button>
                </li>
            </template>
        </ul>
    
    </main>
    <script src="homework-10.js" type = module></script>
    <script type = module src="cards.js"  ></script>
</body>
</html>
